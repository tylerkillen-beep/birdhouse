<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Birdhouse — Meet the Team</title>
  <meta name="description" content="The Birdhouse team bios, one at a time, for the lobby display." />
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --black: #0a0a0a; --red: #cc0000; --red-bright: #ff1a1a;
      --gray: #888; --light-gray: #aaa; --white: #f0f0f0;
      --card: #161616; --border: rgba(204,0,0,0.2);
    }
    html, body { width: 100%; height: 100%; background: #000; overflow: hidden; }
    body { font-family: 'DM Sans', sans-serif; color: var(--white); display: flex; align-items: center; justify-content: center; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
    }

    /* Authored at exactly the ScreenCloud zone size and scaled to whatever
       viewport it lands in, so every size below can be a plain pixel value. */
    .stage { width: 449px; height: 797px; flex-shrink: 0; transform-origin: center center; }

    .panel {
      position: relative; width: 100%; height: 100%;
      display: flex; flex-direction: column; padding: 30px 28px 34px;
      background: linear-gradient(170deg, #101010 0%, #0a0a0a 55%, #140909 100%);
      border: 1px solid var(--border); border-radius: 14px; overflow: hidden;
    }
    /* Same faint grid as the menu board, so the screens read as a set. */
    .panel::after {
      content: ''; position: absolute; inset: 0; pointer-events: none;
      background-image: linear-gradient(rgba(204,0,0,0.035) 1px, transparent 1px), linear-gradient(90deg, rgba(204,0,0,0.035) 1px, transparent 1px);
      background-size: 40px 40px;
    }
    .panel::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; z-index: 2;
      background: linear-gradient(90deg, var(--red) 0%, var(--red-bright) 45%, var(--red) 100%);
    }

    .panel-label {
      position: relative; z-index: 1; text-align: center; flex-shrink: 0;
      font-size: 11px; font-weight: 600; letter-spacing: 0.22em; text-transform: uppercase;
      color: var(--gray); margin-bottom: 22px;
    }

    /* Slides stack and cross-fade, so the card never reflows mid-swap and a
       short bio doesn't make the photo jump up the panel. */
    .slides { position: relative; z-index: 1; flex: 1; min-height: 0; }
    .slide {
      position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
      text-align: center; opacity: 0; transform: translateY(9px);
      transition: opacity 0.7s ease, transform 0.7s ease;
    }
    .slide.is-active { opacity: 1; transform: none; }

    .bio-photo, .bio-initials {
      width: 270px; height: 270px; border-radius: 50%; flex-shrink: 0;
      border: 2px solid rgba(204,0,0,0.35); background: #000;
    }
    .bio-photo { object-fit: cover; }
    .bio-initials {
      display: flex; align-items: center; justify-content: center;
      font-family: 'Bebas Neue', sans-serif; font-size: 82px; letter-spacing: 0.04em;
      color: var(--red-bright); background: rgba(204,0,0,0.08);
    }

    .bio-name {
      font-family: 'Bebas Neue', sans-serif; font-size: 44px; line-height: 1;
      letter-spacing: 0.04em; color: var(--white); margin-top: 22px;
    }
    .bio-rule { width: 54px; height: 2px; background: var(--red-bright); margin: 13px 0 16px; flex-shrink: 0; }
    .bio-text {
      font-size: 16.5px; line-height: 1.55; color: var(--light-gray);
      /* Backstop only -- the longest approved bio fits well inside this. */
      display: -webkit-box; -webkit-line-clamp: 13; -webkit-box-orient: vertical; overflow: hidden;
    }

    .empty { margin: auto; font-size: 15px; color: var(--gray); text-align: center; }
  </style>
</head>
<body>
  <div class="stage" id="stage">
    <div class="panel">
      <div class="panel-label">Meet the Team</div>
      <div class="slides" id="bio-slides"></div>
    </div>
  </div>

  <script>
    (function () {
      'use strict';

      const SUPABASE_URL = 'https://ljukrhneikqbabcmcpet.supabase.co';
      const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxqdWtyaG5laWtxYmFiY21jcGV0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIyODg1MjEsImV4cCI6MjA4Nzg2NDUyMX0.UbtB_-syG9a9vLcJp04w_k2F3XP2tMScYtB4sez3j78';

      // Bios are approved a few times a term, and a reload re-requests 28
      // photos, so this checks far less often than the order banner does.
      const REFRESH_MS = 60 * 60 * 1000;
      // Long enough to read the longest bio at a walking glance.
      const ROTATE_MS = 12 * 1000;

      const STAGE_W = 449, STAGE_H = 797;

      function escHtml(s) {
        return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
          return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
        });
      }

      function rest(path) {
        return fetch(SUPABASE_URL + '/rest/v1/' + path, {
          headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY },
        });
      }

      // Renders every slide once and cross-fades between them. A refresh
      // rebuilds them but keeps the position in the cycle, so it never snaps
      // back to the first person mid-rotation.
      const el = document.getElementById('bio-slides');
      let index = 0, timer = null;

      function show(i) {
        const slides = el.children;
        if (!slides.length) return;
        index = ((i % slides.length) + slides.length) % slides.length;
        for (let n = 0; n < slides.length; n++) {
          slides[n].classList.toggle('is-active', n === index);
        }
      }

      function setSlides(html, startAt) {
        const keep = startAt == null ? index : startAt;
        el.innerHTML = html.map(h => '<div class="slide">' + h + '</div>').join('');
        clearInterval(timer);
        timer = null;
        if (!el.children.length) return;
        show(keep);
        if (el.children.length > 1) timer = setInterval(() => show(index + 1), ROTATE_MS);
      }

      function renderBio(s) {
        const name = [s.first_name, s.last_name].filter(Boolean).join(' ').trim();
        const initials = ((s.first_name || '?')[0] + (s.last_name || '?')[0]).toUpperCase();
        // Same fallback the About page uses: a photo that 404s becomes
        // initials rather than a broken-image icon on the wall.
        const photo = s.bio_photo_url
          ? '<img class="bio-photo" src="' + escHtml(s.bio_photo_url) + '" alt="" '
            + 'onerror="this.outerHTML=\'<div class=&quot;bio-initials&quot; aria-hidden=&quot;true&quot;>' + escHtml(initials) + '</div>\'" />'
          : '<div class="bio-initials" aria-hidden="true">' + escHtml(initials) + '</div>';

        return photo
          + '<div class="bio-name">' + escHtml(name) + '</div>'
          + '<div class="bio-rule" aria-hidden="true"></div>'
          + '<div class="bio-text">' + escHtml(s.bio) + '</div>';
      }

      let started = false;

      async function loadBios() {
        try {
          const res = await rest(
            'students?select=first_name,last_name,bio,bio_photo_url'
            + '&bio_status=eq.approved&bio=not.is.null&order=last_name.asc');
          if (!res.ok) return;                 // keep whoever is on screen up

          const team = (await res.json()).filter(s => (s.bio || '').trim());
          if (!team.length) {
            setSlides(['<div class="empty">Team bios coming soon.</div>']);
            return;
          }

          // Stable order, but a random first face per load -- otherwise the
          // same person opens the loop every time the screen restarts.
          const startAt = started ? null : Math.floor(Math.random() * team.length);
          started = true;
          setSlides(team.map(renderBio), startAt);
        } catch (err) { /* offline for a beat; the next refresh picks it up */ }
      }

      // ScreenCloud hands this zone 449x797, but the same URL gets opened in a
      // browser to check on it. Scale the fixed stage to whatever it lands in.
      function fitStage() {
        const scale = Math.min(window.innerWidth / STAGE_W, window.innerHeight / STAGE_H);
        document.getElementById('stage').style.transform = 'scale(' + scale + ')';
      }

      fitStage();
      window.addEventListener('resize', fitStage);
      if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitStage);

      loadBios();
      setInterval(loadBios, REFRESH_MS);
    })();
  </script>
</body>
</html>
