<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Birdhouse — Menu Board</title>
  <meta name="description" content="The Birdhouse menu board — today's specials, drinks, and treats." />
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <script src="/lib/subscription-exclusives.js"></script>
  <script src="/lib/mathews.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --black: #0a0a0a; --red: #cc0000; --red-bright: #ff1a1a;
      --gray: #888; --light-gray: #aaa; --white: #f0f0f0;
      --card: #161616; --border: rgba(204,0,0,0.2);
    }
    body { background: var(--black); color: var(--white); font-family: 'DM Sans', sans-serif; min-height: 100vh; overflow-x: hidden; }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
    }
    body::before {
      content: ''; position: fixed; inset: 0;
      background-image: linear-gradient(rgba(204,0,0,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(204,0,0,0.03) 1px, transparent 1px);
      background-size: 40px 40px; pointer-events: none; z-index: 0;
    }
    .board { position: relative; z-index: 1; padding: 1.5rem 3rem; min-height: 100vh; }
    .board-header { display: flex; align-items: baseline; gap: 1.25rem; margin-bottom: 0.25rem; }
    .board-title { font-family: 'Bebas Neue', sans-serif; font-size: clamp(2.75rem, 5.5vw, 4.75rem); letter-spacing: 0.03em; line-height: 1; color: var(--white); }
    .board-sub {
      font-family: 'Bebas Neue', sans-serif; font-size: clamp(1.4rem, 2.6vw, 2.1rem); letter-spacing: 0.08em;
      color: transparent; -webkit-text-stroke: 1.5px var(--red-bright); text-transform: uppercase;
    }
    .board-updated { font-size: 0.68rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--gray); margin-top: 0.75rem; margin-bottom: 1rem; }
    .board-loading, .board-error { color: var(--gray); font-size: 1rem; padding: 3rem 0; text-align: center; }
    .board-error { color: var(--red-bright); }

    .board-grid { display: grid; grid-template-columns: minmax(280px, 1fr) 2fr; gap: 2.5rem; align-items: start; }
    @media (max-width: 900px) { .board-grid { grid-template-columns: 1fr; } }
    .board-col-left { display: flex; flex-direction: column; }
    .board-col-right { display: flex; flex-direction: column; }

    /* Specials column. It's the only thing on the left now that Add-Ons
       moved to the right, so it gets the whole column's height to itself. */
    .specials-col { display: flex; flex-direction: column; gap: 1rem; }
    /* Bebas Neue ships a single weight, so font-weight does nothing. Thicken the
       strokes with text-stroke instead — these are read from across the room. */
    .specials-heading {
      font-family: 'Bebas Neue', sans-serif; font-size: 2rem; letter-spacing: 0.1em; text-transform: uppercase;
      color: var(--red-bright); -webkit-text-stroke: 0.7px var(--red-bright);
      border-bottom: 2px solid var(--border); padding-bottom: 0.5rem; margin-bottom: 0.25rem;
    }
    .special-card {
      display: flex; gap: 1.1rem; background: var(--card); border: 1px solid var(--border);
      border-radius: 14px; padding: 1.1rem; align-items: center;
    }
    /* rem, not px, so fitBoard() scales the photos along with the text. */
    .special-photo { width: 5.5rem; height: 5.5rem; border-radius: 10px; object-fit: cover; flex-shrink: 0; background: #000; }
    .special-photo-placeholder {
      width: 5.5rem; height: 5.5rem; border-radius: 10px; flex-shrink: 0; background: rgba(204,0,0,0.1);
      display: flex; align-items: center; justify-content: center; font-size: 1.8rem;
    }
    .special-name-row { display: flex; align-items: baseline; justify-content: space-between; gap: 0.5rem; }
    .special-name { font-size: 2rem; font-weight: 600; color: var(--white); }
    .special-price { font-size: 2rem; color: var(--red-bright); font-weight: 600; white-space: nowrap; }
    .special-desc { font-size: 1.1rem; color: var(--light-gray); line-height: 1.35; margin-top: 0.25rem; font-weight: 300; }

    /* Category lists column. */
    .lists-col { display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; align-items: start; }
    @media (max-width: 700px) { .lists-col { grid-template-columns: 1fr; } }
    .lists-column { display: flex; flex-direction: column; gap: 1.2rem; }
    .list-heading {
      display: flex; align-items: center; justify-content: center; gap: 0.6rem;
      font-family: 'Bebas Neue', sans-serif; font-size: 2rem; letter-spacing: 0.08em; text-transform: uppercase;
      color: var(--red-bright); -webkit-text-stroke: 0.7px var(--red-bright);
      border-bottom: 2px solid var(--border); padding-bottom: 0.5rem; margin-bottom: 0.6rem;
    }
    .list-row {
      display: flex; align-items: baseline; justify-content: space-between; gap: 0.75rem;
      padding: 0.34rem 0; border-bottom: 1px dashed rgba(255,255,255,0.06);
    }
    .list-row:last-child { border-bottom: none; }
    /* The board is fitted to the screen height by fitBoard(), so these sizes are
       ratios, not absolutes: growing a name shortens the fitted root size a
       little but still nets a bigger name. The spotlight only ever fits one
       category at a time now, so there's headroom to size the description
       much closer to the name instead of leaving it as a small afterthought. */
    .list-row-name { font-size: 1.85rem; color: var(--white); font-weight: 600; }
    .list-row-desc { font-size: 1.05rem; color: var(--gray); font-weight: 300; margin-top: 0.15rem; }
    .list-row-price { font-size: 1.85rem; color: var(--red-bright); font-weight: 600; white-space: nowrap; flex-shrink: 0; }

    /* One dot per stocked category, lit up to show which one is spotlighted
       -- otherwise the swap to the next category could read as the board
       having lost items rather than having more to show. */
    .spotlight-dots { display: flex; justify-content: center; gap: 0.5rem; margin-top: 0.75rem; }
    .spotlight-dot { width: 0.55rem; height: 0.55rem; border-radius: 50%; background: var(--border); }
    .spotlight-dot.active { background: var(--red-bright); }

    /* Add-ons, permanently under the spotlighted category rather than
       rotating with it. Four columns because there are usually 3-5 price
       tiers -- almost always one row -- which is the point: say everything
       in the least vertical space so it stops eating into the font size. */
    .addons-section { margin-top: 1.25rem; padding-top: 0.75rem; border-top: 2px solid var(--border); }
    .addons-heading {
      font-family: 'Bebas Neue', sans-serif; font-size: 1.6rem; letter-spacing: 0.1em; text-transform: uppercase;
      color: var(--red-bright); -webkit-text-stroke: 0.5px var(--red-bright); text-align: center; margin-bottom: 0.6rem;
    }
    .addons-grid { display: grid; grid-template-columns: repeat(4, 1fr); column-gap: 1.5rem; row-gap: 0.3rem; }
    @media (max-width: 1100px) { .addons-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 700px) { .addons-grid { grid-template-columns: 1fr; } }
    .addon-tier { display: flex; align-items: baseline; gap: 0.6rem; }
    .addon-price { font-size: 1.15rem; font-weight: 600; color: var(--red-bright); min-width: 2.6rem; white-space: nowrap; }
    .addon-names { font-size: 1.05rem; font-weight: 500; color: var(--white); }

    .board-footer { margin-top: 1rem; text-align: center; font-size: 0.68rem; letter-spacing: 0.15em; text-transform: uppercase; color: var(--gray); }
  </style>
</head>
<body>
  <main class="board" id="main-content">
    <div class="board-grid">
      <!-- The title sits above Specials rather than across the top, so the two
           list columns can start at the very top and use that full height. -->
      <div class="board-col-left">
        <div class="board-header">
          <div class="board-title">The Birdhouse</div>
          <div class="board-sub">Menu</div>
        </div>
        <div class="board-updated" id="board-updated"></div>
        <div id="board-specials"></div>
      </div>
      <div class="board-col-right">
        <div class="lists-col" id="board-lists"></div>
        <div id="board-addons"></div>
      </div>
    </div>
    <div id="board-status"><p class="board-loading">Loading menu&hellip;</p></div>
    <div class="board-footer">Nixa Eagles &middot; Serving Since 2014</div>
  </main>

  <script>
    (function() {
      const SUPABASE_URL = 'https://ljukrhneikqbabcmcpet.supabase.co';
      const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxqdWtyaG5laWtxYmFiY21jcGV0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIyODg1MjEsImV4cCI6MjA4Nzg2NDUyMX0.UbtB_-syG9a9vLcJp04w_k2F3XP2tMScYtB4sez3j78';
      const REFRESH_MS = 5 * 60 * 1000; // kiosk display — refresh every 5 minutes
      // The right two-thirds spotlights one whole category at a time --
      // Cold Drinks, then Birdie Brews, then Tasty Treats -- so it gets the
      // full width and height instead of being squeezed into half of it.
      // Specials always shows in full and never rotates.
      const SPOTLIGHT_MS = 12000; // how long each category stays up
      const reducedMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      // Same category grouping as menu.html, kept in sync intentionally. The
      // order here is the order they spotlight in.
      const CATEGORIES = [
        { key: 'soda_tea', title: 'Cold Drinks',  icon: '🥤' },
        { key: 'coffee',   title: 'Birdie Brews', icon: '☕' },
        { key: 'food',     title: 'Tasty Treats', icon: '🍪' },
      ];

      let latestGroups = null; // key -> this load's items, set by loadBoard
      let spotlightIndex = 0; // which CATEGORIES entry the right side shows

      // Coffee is the coffee menu and nothing else, so it has to be matched
      // explicitly and everything left over falls to cold drinks. This used to
      // be the other way round -- coffee was the catch-all -- which swept in
      // every drink whose category didn't spell out "soda"/"tea", including the
      // whole menu after the 2026-08-28 Square sync reset it all to 'Coffee'.
      const COFFEE_CATEGORY_RE = /coffee|espresso|brew|latte|mocha|americano|cappuccino/;
      function getCategory(item) {
        const n = String(item.category || '').trim().toLowerCase();
        if (n.includes('special')) return 'specials';
        if (n.includes('food') || n.includes('pastry') || n.includes('snack') || n.includes('bak') || n.includes('cookie')) return 'food';
        if (COFFEE_CATEGORY_RE.test(n)) return 'coffee';
        return 'soda_tea';
      }

      function priceCents(item) {
        if (item.base_price_cents != null) return item.base_price_cents;
        if (item.base_price != null) return Math.round(parseFloat(item.base_price) * 100);
        return null;
      }

      function formatPrice(item) {
        const cents = priceCents(item);
        return cents == null ? '' : '$' + (cents / 100).toFixed(2);
      }

      function escHtml(str) {
        return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
      }

      // Cheapest first; items without a price fall to the end. The specials
      // cards and every category list share it, so a customer scanning any
      // part of the board always reads cheapest to dearest.
      const byPriceAsc = (a, b) => {
        const pa = priceCents(a), pb = priceCents(b);
        if (pa == null) return pb == null ? 0 : 1;
        if (pb == null) return -1;
        return pa - pb;
      };

      /** The CATEGORIES index to spotlight starting at startIndex: the first
       *  one (going forward, wrapping) that actually has items. Falls back to
       *  startIndex itself if every category is empty. */
      function pickSpotlight(startIndex) {
        for (let i = 0; i < CATEGORIES.length; i++) {
          const idx = (startIndex + i) % CATEGORIES.length;
          if ((latestGroups[CATEGORIES[idx].key] || []).length) return idx;
        }
        return startIndex;
      }

      function renderSpecials(items) {
        if (!items.length) return '';
        const sorted = items.slice().sort(byPriceAsc);
        const cards = sorted.map(item => `
          <div class="special-card">
            ${item.image_url
              ? `<img class="special-photo" src="${escHtml(item.image_url)}" alt="" onerror="this.outerHTML='<div class=&quot;special-photo-placeholder&quot; aria-hidden=&quot;true&quot;>✨</div>'" />`
              : `<div class="special-photo-placeholder" aria-hidden="true">✨</div>`}
            <div style="flex:1;min-width:0">
              <div class="special-name-row">
                <span class="special-name">${escHtml(item.name)}</span>
                ${formatPrice(item) ? `<span class="special-price">${formatPrice(item)}</span>` : ''}
              </div>
              ${item.description ? `<div class="special-desc">${escHtml(item.description)}</div>` : ''}
            </div>
          </div>
        `).join('');
        return `<div class="specials-col"><div class="specials-heading">✨ Specials</div>${cards}</div>`;
      }

      // Add-ons under the specials, grouped by price like the old board. Prices
      // come live from the modifier options attached to items on the board, so
      // a Square price change shows up here and a group whose options are all
      // marked out of stock drops off. Each option joins the first group it
      // matches; anything unmatched is left off, which keeps the board generic
      // (it says "Flavor Shot", never which flavors). Groups are listed in the
      // order they appear on the board.
      const ADD_ON_GROUPS = [
        { label: 'Marshmallows',  match: (opt) => /marshmallow/i.test(opt) },
        // The boba flavors live in Square's "Flavor Shots" set, so keep them
        // out of Flavor Shot and let them fall through to Boba.
        { label: 'Flavor Shot',   match: (opt, list) => /flavor/i.test(list) && !/whip|boba/i.test(opt) },
        { label: 'Whipped Cream', match: (opt) => /whip/i.test(opt) },
        { label: 'Espresso Shot', match: (opt) => /espresso/i.test(opt) },
        { label: 'Cold Foam',     match: (opt) => /cold foam/i.test(opt) },
        { label: 'Drizzle',       match: (opt) => /drizzle/i.test(opt) },
        { label: 'Iced',          match: (opt) => /^iced$/i.test(opt.trim()) },
        // Boba shows its highest price: the current boba flavors are $1.00, but
        // older 75¢ boba options still in Square would otherwise drag it down.
        { label: 'Boba',          match: (opt, list) => /boba/i.test(list) || /boba/i.test(opt), highest: true },
      ];

      /** [[priceCents, [labels…]], …], cheapest tier first. Only lists attached
       *  to an item on the board count, so old unused lists in Square (with
       *  their own prices) can't leak onto it. A group priced differently
       *  across options shows its lowest price, or its highest if marked
       *  `highest`. */
      function buildAddOnTiers(items, lists, options) {
        const onBoard = new Set(items.filter(i => getCategory(i)).flatMap(i => i.square_modifier_list_ids || []));
        const listNames = new Map(lists.filter(l => onBoard.has(l.square_id)).map(l => [l.id, l.name]));
        const prices = new Map();
        options.forEach(opt => {
          if (opt.available === false || !(opt.price_cents > 0) || !listNames.has(opt.modifier_list_id)) return;
          const group = ADD_ON_GROUPS.find(g => g.match(opt.name || '', listNames.get(opt.modifier_list_id)));
          if (!group) return;
          const pick = group.highest ? Math.max : Math.min;
          prices.set(group.label, pick(prices.get(group.label) ?? (group.highest ? -Infinity : Infinity), opt.price_cents));
        });
        const tiers = new Map();
        ADD_ON_GROUPS.forEach(g => {
          if (!prices.has(g.label)) return;
          const cents = prices.get(g.label);
          if (!tiers.has(cents)) tiers.set(cents, []);
          tiers.get(cents).push(g.label);
        });
        return [...tiers].sort((a, b) => a[0] - b[0]);
      }

      function renderAddOns(tiers) {
        if (!tiers.length) return '';
        const price = cents => cents < 100 ? cents + '¢' : '$' + (cents / 100).toFixed(2);
        const tiles = tiers.map(([cents, labels]) => `
          <div class="addon-tier">
            <span class="addon-price">${price(cents)}</span>
            <span class="addon-names">${labels.map(escHtml).join(' · ')}</span>
          </div>
        `).join('');
        return `<div class="addons-section"><div class="addons-heading">Add-Ons</div><div class="addons-grid">${tiles}</div></div>`;
      }

      function renderRows(items) {
        return items.map(item => `
          <div class="list-row">
            <div>
              <div class="list-row-name">${escHtml(item.name)}</div>
              ${item.description ? `<div class="list-row-desc">${escHtml(item.description)}</div>` : ''}
            </div>
            ${formatPrice(item) ? `<div class="list-row-price">${formatPrice(item)}</div>` : ''}
          </div>
        `).join('');
      }

      // The spotlighted category's items span both grid tracks of #board-lists:
      // the heading across the top, then the items split into two even halves
      // (cheapest first) so a single category gets the full two-thirds width
      // instead of sharing it with another category. Reused by both the
      // initial paint and the spotlight ticker.
      function renderListsHtml() {
        if (!latestGroups) return '';
        const cat = CATEGORIES[spotlightIndex];
        const items = (latestGroups[cat.key] || []).slice().sort(byPriceAsc);
        if (!items.length) return '';
        const half = Math.ceil(items.length / 2);
        const heading = `<div class="list-heading" style="grid-column:1 / -1"><span aria-hidden="true">${cat.icon}</span> ${cat.title}</div>`;
        const cols = [items.slice(0, half), items.slice(half)]
          .map(colItems => `<div class="lists-column">${renderRows(colItems)}</div>`)
          .join('');
        const dots = CATEGORIES.filter(c => (latestGroups[c.key] || []).length).length > 1
          ? `<div class="spotlight-dots" style="grid-column:1 / -1">${CATEGORIES
              .filter(c => (latestGroups[c.key] || []).length)
              .map(c => `<span class="spotlight-dot${c.key === cat.key ? ' active' : ''}"></span>`)
              .join('')}</div>`
          : '';
        return heading + cols + dots;
      }

      // Scale the whole board so it exactly fills the TV: binary-search the root
      // font-size for the largest value that still fits without scrolling. Every
      // size on the page is in rem, so this grows text and spacing together.
      let fitting = false;
      function fitBoard() {
        if (fitting) return; // the probe loop resizes a lot; ignore its own echoes
        fitting = true;
        try { fitBoardInner(); } finally { fitting = false; }
      }

      function fitBoardInner() {
        const root = document.documentElement;
        const MIN = 8, MAX = 34;
        // A resize fires many times mid-drag, sometimes at a transient tiny
        // height. Fitting against that would pin the board at MIN and stick.
        if (window.innerHeight < 200) return;
        // .board has min-height:100vh, which floors scrollHeight at the viewport
        // height and would make every probe look like it fits. Drop the floor
        // while measuring so we read the real content height.
        const board = document.querySelector('.board');
        const prevMinHeight = board.style.minHeight;
        board.style.minHeight = '0';

        // Leave a little headroom: fonts and photos can settle a few px taller
        // after the measurement, and on a kiosk any overflow means a scrollbar.
        const limit = window.innerHeight - 8;
        let lo = MIN, hi = MAX, best = MIN;
        for (let i = 0; i < 14; i++) {
          const mid = (lo + hi) / 2;
          root.style.fontSize = mid + 'px';
          if (board.scrollHeight <= limit) { best = mid; lo = mid; }
          else { hi = mid; }
        }
        root.style.fontSize = best + 'px';

        // Belt and braces: if it still overflows (a webfont swapped in and
        // changed metrics mid-measurement), step down until it genuinely fits.
        for (let i = 0; i < 12 && board.scrollHeight > limit && best > MIN; i++) {
          best = Math.max(MIN, best - 0.5);
          root.style.fontSize = best + 'px';
        }

        board.style.minHeight = prevMinHeight;
      }

      function rest(path) {
        return fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
          headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY },
        });
      }

      // The add-ons are extra: if they fail to load, the rest of the board
      // still shows, just without them.
      // Subscription exclusives and the Mathews Teacher Menu never go on the
      // board. If the categories fail to load, nothing is filtered --
      // process-payment still refuses to sell them to the wrong customer.
      async function loadSquareCategories() {
        try {
          const res = await rest('square_categories?select=square_id,name');
          return res.ok ? await res.json() : [];
        } catch {
          return [];
        }
      }

      async function loadAddOnOptions() {
        const [listsRes, optionsRes] = await Promise.all([
          rest('modifier_lists?select=id,square_id,name'),
          rest('modifier_options?select=*'),
        ]);
        if (!listsRes.ok || !optionsRes.ok) return null;
        return { lists: await listsRes.json(), options: await optionsRes.json() };
      }

      async function loadBoard() {
        const status = document.getElementById('board-status');
        try {
          const [res, addOnData, squareCategories] = await Promise.all([
            rest('menu_items?select=name,description,category,base_price_cents,base_price,sort_order,image_url,square_modifier_list_ids,square_category_ids&available=eq.true&order=category.asc,sort_order.asc'),
            loadAddOnOptions().catch(() => null),
            loadSquareCategories(),
          ]);
          if (!res.ok) throw new Error('Failed to load menu');
          const exclusiveIds = subscriptionExclusiveCategoryIds(squareCategories);
          const mathewsIds = mathewsMenuCategoryIds(squareCategories);
          const items = (await res.json()).filter(item =>
            !isSubscriptionExclusive(item, exclusiveIds) && !isMathewsMenuItem(item, mathewsIds));

          const specials = [];
          const groups = {};
          CATEGORIES.forEach(c => { groups[c.key] = []; });
          items.forEach(item => {
            const key = getCategory(item);
            if (key === 'specials') specials.push(item);
            else if (key && groups[key]) groups[key].push(item);
          });

          latestGroups = groups;
          // Keep spotlighting the same category across a routine reload
          // (falling forward only if it just went empty), rather than
          // visibly resetting to Cold Drinks every 5 minutes.
          spotlightIndex = pickSpotlight(spotlightIndex);

          const specialsHtml = renderSpecials(specials);
          const addOnsHtml = addOnData ? renderAddOns(buildAddOnTiers(items, addOnData.lists, addOnData.options)) : '';
          const listsHtml = renderListsHtml();

          const grid = document.querySelector('.board-grid');
          if (!specialsHtml && !listsHtml) {
            grid.style.display = 'none';
            status.innerHTML = '<p class="board-loading">No items available right now.</p>';
          } else {
            grid.style.display = '';
            status.innerHTML = '';
            document.getElementById('board-specials').innerHTML = specialsHtml;
            document.getElementById('board-addons').innerHTML = addOnsHtml;
            document.getElementById('board-lists').innerHTML = listsHtml;
          }
          document.getElementById('board-updated').textContent = 'Updated ' + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
          fitBoard();
          // Photos and webfonts can land after this pass; re-fit once they have.
          setTimeout(fitBoard, 800);
        } catch (err) {
          status.innerHTML = '<p class="board-error">Unable to load menu. Retrying shortly&hellip;</p>';
        }
      }

      // Advance the spotlight to the next non-empty category and repaint just
      // the lists column. With one or zero categories stocked there's nowhere
      // to advance to, so it holds -- same as Specials, which never moves.
      function tick() {
        if (!latestGroups || reducedMotion) return;
        const stocked = CATEGORIES.filter(c => (latestGroups[c.key] || []).length).length;
        if (stocked <= 1) return;
        spotlightIndex = pickSpotlight(spotlightIndex + 1);
        document.getElementById('board-lists').innerHTML = renderListsHtml();
        fitBoard();
      }

      loadBoard();
      setInterval(loadBoard, REFRESH_MS);
      setInterval(tick, SPOTLIGHT_MS);
      // Re-fit on resize, and once more after webfonts land (they change metrics).
      let fitTimer;
      window.addEventListener('resize', () => {
        clearTimeout(fitTimer);
        fitTimer = setTimeout(fitBoard, 200); // settle before measuring
      });
      if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitBoard);
      // Webfonts and photos change the board's height whenever they land, and
      // timers only guess at when that is. Re-fit whenever the box actually
      // changes; fitBoard is deterministic, so this settles after one pass.
      if (window.ResizeObserver) {
        new ResizeObserver(fitBoard).observe(document.querySelector('.board'));
      }
    })();
  </script>
</body>
</html>
